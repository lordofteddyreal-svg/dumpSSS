name: dump-aurora-keys
on:
  workflow_dispatch:
    inputs:
      jar_url:
        description: 'Direct URL to Aurora-orig.jar'
        required: true
jobs:
  dump:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download jar
        run: curl -L "${{ inputs.jar_url }}" -o Aurora-orig.jar
        shell: bash
      - name: Compile dumper
        run: javac DumpKeys.java
        shell: bash
      - name: Run dump
        run: java -cp ".;Aurora-orig.jar" DumpKeys Aurora-orig.jar keys.bin
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: keys
          path: keys.bin
